<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <style>
    body{
      font-family: Arial;
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      background:white;
      padding:25px;
      border-radius:8px;
      width:320px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    input{
      width:100%;
      padding:8px;
      margin:6px 0 12px 0;
      border:1px solid #ccc;
      border-radius:4px;
    }

    button{
      width:100%;
      padding:10px;
      background:#007bff;
      border:none;
      color:white;
      border-radius:4px;
      cursor:pointer;
    }

    button:hover{
      background:#0056b3;
    }

    #message{
      margin-top:10px;
      font-weight:bold;
      text-align:center;
    }
  </style>

</head>

<body>

<div class="container">

<h2>Register</h2>

<form id="registerForm">

<label>Name</label>
<input type="text" id="name">

<label>Email</label>
<input type="text" id="email">

<label>Password</label>
<input type="password" id="password">

<label>Confirm Password</label>
<input type="password" id="confirmPassword">

<label>Age</label>
<input type="number" id="age">

<label>
<input type="checkbox" id="terms">
I agree to terms
</label>

<button type="submit">Register</button>

</form>

<p id="message"></p>

</div>

<script>

const form = document.getElementById("registerForm");

form.addEventListener("submit", function(e){

  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const age = document.getElementById("age").value;
  const terms = document.getElementById("terms").checked;

  const message = document.getElementById("message");

  // required fields
  if(name === "" || email === "" || password === ""){
    message.innerText = "Please fill required fields";
    return;
  }

  // email validation
  if(!email.includes("@")){
    message.innerText = "Invalid email";
    return;
  }

  // password match
  if(password !== confirmPassword){
    message.innerText = "Passwords do not match";
    return;
  }

  // password length
  if(password.length < 6){
    message.innerText = "Password too short";
    return;
  }

  // BUG 1: age validation incorrect
  if(age < 18){
    message.innerText = "Age accepted";
  }

  // BUG 2: checkbox validation reversed
  if(terms){
    message.innerText = "You must accept terms";
    return;
  }

  // success
  message.innerText = "Registration successful";

});

</script>

</body>
</html>
